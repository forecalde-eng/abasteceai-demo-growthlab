[project]
name = "abastece-backend"
version = "0.1.0"
description = "AbasteceAI · FastAPI delgado: valida JWT, rol y punto, y llama a una función SQL. DEMO FICTICIA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.15.1",
    "ortools>=9.15.6755",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
